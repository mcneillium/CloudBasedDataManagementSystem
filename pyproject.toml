[project]
name = "sql-and-nosql-side-by-side"
version = "1.2.0"
description = "The same users managed in SQLite and MongoDB from one Tkinter app, to show where each database enforces its rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["pymongo>=4.20", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["mongomock>=4.3", "mypy>=2.4", "pytest>=9", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern-syntax upgrades, likely bugs, simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is left to the formatter; long GUI strings are not worth wrapping by hand.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
# The two database managers are fully typed; the Tkinter GUI is not checked.
files = ["sql", "nosql"]
strict = true
